<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form de pago</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light py-5">

    <div class="container">
      <div class="card shadow-sm">
        <div class="card-header">
          <h4 class="mb-0">Plataforma de pago</h4>
        </div>
  
        <div class="alert alert-danger mb-0">
          No tienes dinero, pobre!
        </div>
  
        <div class="card-body">
          <form>
            <div class="row mb-3">
              <div class="col-md-6 col-lg-4">
                <label class="form-label">Card #</label>
                <input type="text" class="form-control" placeholder="XXXXXXXXXXXXXXXXXX">
              </div>
              <div class="col-md-3 col-lg-4">
                <label class="form-label">CVC #</label>
                <input type="text" class="form-control" placeholder="0000">
              </div>
              <div class="col-md-3 col-lg-4">
                <label class="form-label">Monto</label>
                <div class="input-group">
                  <span class="input-group-text">€</span>
                  <input type="text" class="form-control" placeholder="Amount">
                </div>
              </div>
            </div>
  
            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label">Nombres</label>
                <input type="text" class="form-control">
              </div>
              <div class="col-md-6">
                <label class="form-label">Apellidos</label>
                <input type="text" class="form-control">
              </div>
            </div>
  
            <div class="row mb-3">
              <div class="col-md-4">
                <label class="form-label">Ciudad</label>
                <input type="text" class="form-control">
              </div>
              <div class="col-md-4">
                <label class="form-label">Pais</label>
                <select class="form-select">
                  <option selected disabled>Selecciona un estado</option>
                  <option >Españita</option>
                  <option >Venezuela</option>
                  <option >Usa</option>
                  <option >Francia</option>
                  <option >Mi casa</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Codigo Postal</label>
                <input type="text" class="form-control">
              </div>
            </div>
  
            <div class="mb-3">
              <label class="form-label">We accept:</label><br />
              <img src="https://upload.wikimedia.org/wikipedia/commons/4/41/Visa_Logo.png" alt="Visa" height="30">
              <img src="https://upload.wikimedia.org/wikipedia/commons/0/04/Mastercard-logo.png" alt="Mastercard" height="30">
              <img src="https://cdn-icons-png.flaticon.com/512/349/349228.png" alt="Amex" height="30">
            </div>
  
            <div class="mb-3">
              <label class="form-label">Mensaje</label>
              <textarea class="form-control" placeholder="Add any notes here."></textarea>
            </div>
  
            <div class="text-end">
              <button type="button" class="btn btn-secondary me-2">Cancel</button>
              <button type="submit" class="btn btn-primary">Send</button>
            </div>
          </form>
        </div>
      </div>
    </div>  
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script> 
</body>
</html>
